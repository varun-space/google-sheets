<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Video Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lora:wght@600&family=Sora:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/meda-partners-colour.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/env-banner.js"></script>
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <div class="grow">
        <h1 id="title">Dashboard</h1>
        <div class="muted" id="periodLabel"></div>
      </div>
      <div class="field hidden" id="viewAsWrap">
        <label for="viewAs" id="viewAsLabel">View as</label>
        <select id="viewAs"></select>
      </div>
      <button class="ghost" id="refreshBtn">↻ Refresh</button>
      <button class="ghost" id="printBtn">🖨 Print</button>
    </div>

    <div class="viewas-bar hidden" id="viewAsBar">
      <span id="viewAsText"></span>
      <button class="ghost sm" id="backBtn">← Back to everyone</button>
    </div>

    <div class="pills" id="periodPills"></div>
    <div class="toolbar hidden" id="customBox">
      <div class="field"><label for="cFrom" id="cFromLabel">From</label><input type="date" id="cFrom"></div>
      <div class="field"><label for="cTo" id="cToLabel">To</label><input type="date" id="cTo"></div>
      <button id="cApply">Apply</button>
    </div>

    <div class="error-box hidden" id="errorBox"></div>

    <div id="content">
      <div class="card loading"><div class="spinner"></div>Loading dashboard…</div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/kpi.js"></script>
  <script src="/js/tasks-ui.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
